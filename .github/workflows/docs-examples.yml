name: Docs examples

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run deterministic offline examples
        run: GOWORK=off GOCACHE=/tmp/looprig-tools-docs-gocache go test ./examples/...
      - name: Run repository checks
        run: GOWORK=off GOCACHE=/tmp/looprig-tools-docs-gocache make test
      - name: Run race-enabled standalone tests
        run: GOWORK=off GOCACHE=/tmp/looprig-tools-docs-gocache go test -race ./...
